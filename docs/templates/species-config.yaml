schema_version: "1.0"
species_id: SPECIES_NAME
common_name: Common Name
scientific_name: Genus species

phases:
  colonization:
    label: Colonization
    description: Mycelium running through substrate.
    duration_estimate: 14-21
    transition_trigger: manual
    targets:
      temperature:
        ideal_min: 21
        ideal_max: 24
        accept_min: 18
        accept_max: 26
        alert_min: 16
        alert_max: 28
      humidity:
        ideal_min: 85
        ideal_max: 95
        accept_min: 80
        accept_max: 95
        alert_min: 75
        alert_max: 98
      co2:
        ideal_min: 2000
        ideal_max: 5000
        accept_min: 0
        accept_max: 8000
        alert_min: 0
        alert_max: 10000
    fan_rules:
      authority: false
      burst_duration: 360
      humidity_floor: 80
      co2_trigger: 10000
      co2_critical: 15000
      mode: off
    humidifier_rules:
      active: true
      humidity_target: 90
      deadband_low: 85
      deadband_high: 95
    notes: Fan OFF during colonization to promote CO2 retention.

  primordia:
    label: Primordia / Pinning
    description: First pin formations.
    duration_estimate: 3-7
    transition_trigger: manual
    targets:
      temperature:
        ideal_min: 16
        ideal_max: 18
        accept_min: 14
        accept_max: 20
        alert_min: 12
        alert_max: 22
      humidity:
        ideal_min: 92
        ideal_max: 96
        accept_min: 88
        accept_max: 98
        alert_min: 85
        alert_max: 99
      co2:
        ideal_min: 400
        ideal_max: 800
        accept_min: 0
        accept_max: 1200
        alert_min: 0
        alert_max: 1500
    fan_rules:
      authority: true
      burst_duration: 360
      humidity_floor: 90
      co2_trigger: 1200
      co2_critical: 2000
      mode: burst
    humidifier_rules:
      active: true
      humidity_target: 92
      deadband_low: 88
      deadband_high: 96
    notes: Stillness critical. Minimal FAE. High humidity.

  fruiting:
    label: Fruiting
    description: Caps expanding, active growth.
    duration_estimate: 5-10
    transition_trigger: auto
    targets:
      temperature:
        ideal_min: 16
        ideal_max: 18
        accept_min: 14
        accept_max: 20
        alert_min: 12
        alert_max: 22
      humidity:
        ideal_min: 88
        ideal_max: 92
        accept_min: 85
        accept_max: 95
        alert_min: 80
        alert_max: 98
      co2:
        ideal_min: 400
        ideal_max: 800
        accept_min: 0
        accept_max: 1200
        alert_min: 0
        alert_max: 1500
    fan_rules:
      authority: true
      burst_duration: 360
      humidity_floor: 88
      co2_trigger: 1200
      co2_critical: 2000
      mode: burst
    humidifier_rules:
      active: true
      humidity_target: 90
      deadband_low: 85
      deadband_high: 95
    notes: Standard fruiting phase. Watch for edge curling.

  late-stage-fruiting:
    label: Late-Stage Fruiting
    description: Final flush, exposed blocks at cap development maximum.
    duration_estimate: 3-5
    transition_trigger: auto
    targets:
      temperature:
        ideal_min: 16
        ideal_max: 18
        accept_min: 14
        accept_max: 20
        alert_min: 12
        alert_max: 22
      humidity:
        ideal_min: 85
        ideal_max: 90
        accept_min: 82
        accept_max: 93
        alert_min: 80
        alert_max: 95
      co2:
        ideal_min: 200
        ideal_max: 500
        accept_min: 0
        accept_max: 800
        alert_min: 0
        alert_max: 1200
    fan_rules:
      authority: true
      burst_duration: 120
      humidity_floor: 50
      co2_trigger: 800
      co2_critical: 1200
      mode: continuous
    humidifier_rules:
      active: true
      humidity_target: 88
      deadband_low: 82
      deadband_high: 93
    notes: Fan continuous for CO2 priority. Humidifier floor rules supersede here.
    transition_conditions:
      humidity_drop: "<85 for >24h → rest"
      no_new_growth: "No new pins for 48h → rest"

  rest:
    label: Rest
    description: Drying, cleaning, or second flush prep.
    duration_estimate: 1-3
    transition_trigger: manual
    targets:
      temperature: {}
      humidity: {}
      co2: {}
    fan_rules:
      authority: false
      mode: monitor
    humidifier_rules:
      active: false
    notes: Monitor only. No autonomous actions.

  inactive:
    label: Inactive / No Blocks
    description: Tent cleaned, blocks removed. No active grow. All actuators OFF.
    duration_estimate: null
    transition_trigger: manual
    targets:
      temperature:
        ideal_min: null
        ideal_max: null
        accept_min: null
        accept_max: null
        alert_min: null
        alert_max: null
      humidity:
        ideal_min: null
        ideal_max: null
        accept_min: null
        accept_max: null
        alert_min: null
        alert_max: null
      co2:
        ideal_min: null
        ideal_max: null
        accept_min: null
        accept_max: null
        alert_min: null
        alert_max: null
    fan_rules:
      authority: false
      mode: nil
      reason: No blocks — operator manual control only
    humidifier_rules:
      authority: false
      mode: nil
      target: null
      deadband: null
      reason: No blocks — operator manual control only
    notes:
      - ALL ACTUATORS are MANUAL. Decision engine will never touch relays.
      - Use for cleaning, drying, waiting for next grow cycle.
      - Auto-phase will NOT transition out of inactive.

sensor_authority:
  temperature: sht45
  humidity: sht45
  co2: scd41

safety:
  oversaturation_guard_rh: 98
  max_temp: 28
  min_temp: 10
