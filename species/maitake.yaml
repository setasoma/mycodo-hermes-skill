schema_version: "1.0"
species_id: maitake
common_name: Maitake
scientific_name: Grifola frondosa

# Maitake notes:
# - Hen of the Woods — prized culinary and medicinal
# - Wood decomposer, slow colonizer
# - Cooler temperatures strongly preferred
# - Very high fresh air requirement — forms dense clusters
# - Sensitive to high CO2 — becomes leggy without ventilation
# - Long colonization, quick fruiting

phases:
  colonization:
    label: Spawn Run
    description: Slow, thorough colonization. Patience required.
    duration_estimate: 30-60
    targets:
      temperature:
        ideal_min: 18
        ideal_max: 22
        accept_min: 16
        accept_max: 24
        alert_min: 14
        alert_max: 26
      humidity:
        ideal_min: 80
        ideal_max: 90
        accept_min: 75
        accept_max: 92
        alert_min: 70
        alert_max: 95
      co2:
        ideal_min: 2000
        ideal_max: 5000
        accept_min: 0
        accept_max: 8000
        alert_min: 0
        alert_max: 10000
    fan_rules:
      authority: false
      burst_duration: 360
      humidity_floor: 75
      co2_trigger: 10000
      co2_critical: 15000
      mode: off
    humidifier_rules:
      active: true
      humidity_target: 85
      deadband_low: 75
      deadband_high: 90
    notes: Dark, still. Long colonization. Monitor for contamination.

  primordia:
    label: Pin Formation
    description: Drop temp 5-10C, increase FAE to trigger clustering.
    duration_estimate: 7-14
    transition_trigger: manual
    targets:
      temperature:
        ideal_min: 12
        ideal_max: 16
        accept_min: 10
        accept_max: 18
        alert_min: 8
        alert_max: 20
      humidity:
        ideal_min: 85
        ideal_max: 92
        accept_min: 80
        accept_max: 95
        alert_min: 75
        alert_max: 98
      co2:
        ideal_min: 500
        ideal_max: 1000
        accept_min: 0
        accept_max: 1500
        alert_min: 0
        alert_max: 2000
    fan_rules:
      authority: true
      burst_duration: 360
      humidity_floor: 80
      co2_trigger: 1500
      co2_critical: 2000
      mode: burst
    humidifier_rules:
      active: true
      humidity_target: 88
      deadband_low: 80
      deadband_high: 92
    notes: Cold shock critical. High FAE prevents leggy growth.

  fruiting:
    label: Fruiting
    description: Dense cluster "hen" forms. Rapid growth once initiated.
    duration_estimate: 10-20
    transition_trigger: auto
    targets:
      temperature:
        ideal_min: 15
        ideal_max: 18
        accept_min: 13
        accept_max: 20
        alert_min: 10
        alert_max: 22
      humidity:
        ideal_min: 86
        ideal_max: 92
        accept_min: 80
        accept_max: 95
        alert_min: 75
        alert_max: 98
      co2:
        ideal_min: 400
        ideal_max: 800
        accept_min: 0
        accept_max: 1200
        alert_min: 0
        alert_max: 1500
    fan_rules:
      authority: true
      burst_duration: 360
      humidity_floor: 80
      co2_trigger: 1200
      co2_critical: 1500
      mode: burst
    humidifier_rules:
      active: true
      humidity_target: 89
      deadband_low: 80
      deadband_high: 92
    notes: Maitake clusters are massive — ensure adequate spacing.

  late_stage_fruiting:
    label: Late Fruiting / Spore
    description: Cluster fully expanded. Heavy spore producer.
    duration_estimate: 5-14
    transition_trigger: auto
    targets:
      temperature:
        ideal_min: 12
        ideal_max: 16
        accept_min: 10
        accept_max: 18
        alert_min: 8
        alert_max: 20
      humidity:
        ideal_min: 82
        ideal_max: 88
        accept_min: 75
        accept_max: 90
        alert_min: 70
        alert_max: 95
      co2:
        ideal_min: 400
        ideal_max: 800
        accept_min: 0
        accept_max: 1200
        alert_min: 0
        alert_max: 1500
    fan_rules:
      authority: true
      burst_duration: 0
      humidity_floor: 0
      co2_trigger: 0
      co2_critical: 0
      mode: continuous
    humidifier_rules:
      active: false
    notes: Continuous fan for spore management. Drop humidity slightly.

  rest:
    label: Rest / Drying
    description: Post-harvest cleanup. Heavy logs may flush again.
    duration_estimate: 7-14
    transition_trigger: manual
    targets:
      temperature:
        ideal_min: 16
        ideal_max: 22
        accept_min: 14
        accept_max: 24
        alert_min: 10
        alert_max: 26
      humidity:
        ideal_min: 55
        ideal_max: 65
        accept_min: 50
        accept_max: 75
        alert_min: 45
        alert_max: 80
      co2:
        ideal_min: 400
        ideal_max: 800
        accept_min: 0
        accept_max: 1500
        alert_min: 0
        alert_max: 2000
    fan_rules:
      authority: false
      burst_duration: 0
      humidity_floor: 50
      co2_trigger: 2000
      co2_critical: 3000
      mode: monitor
    humidifier_rules:
      active: false
    notes: Full dry before next flush attempt.

sensor_authority:
  temperature: sht45
  humidity: sht45
  co2: scd41

safety:
  oversaturation_guard_rh: 95
  max_temp: 26
  min_temp: 8
  sensor_offline_minutes: 30
