schema_version: "1.0"
species_id: reishi
common_name: Reishi
scientific_name: Ganoderma lucidum

# Reishi notes:
# - Extremely slow colonizer: 6-12 months on logs, 2-3 months on blocks
# - Low temperature needs compared to other species
# - Very high CO2 tolerance during colonization
# - Antler form vs conk form — CO2 determines morphology
#   - High CO2 (>2000 ppm) → antler form (finger-like)
#   - Low CO2 (<1000 ppm) → conk/shelf form (classic mushroom shape)
# - Conk form requires antler→conk transition (manual CO2 drop + light)

phases:
  colonization:
    label: Spawn Run / Colonization
    description: Very slow. High CO2 promotes antler morphology. Minimal disturbance.
    duration_estimate: 60-90  # 2-3 months for blocks, much longer for logs
    targets:
      temperature:
        ideal_min: 20
        ideal_max: 24
        accept_min: 18
        accept_max: 26
        alert_min: 15
        alert_max: 28
      humidity:
        ideal_min: 80
        ideal_max: 90
        accept_min: 75
        accept_max: 92
        alert_min: 70
        alert_max: 95
      co2:
        ideal_min: 3000
        ideal_max: 8000
        accept_min: 2000
        accept_max: 10000
        alert_min: 0
        alert_max: 15000
    fan_rules:
      authority: false
      burst_duration: 360
      humidity_floor: 75
      co2_trigger: 15000
      co2_critical: 20000
      mode: off
    humidifier_rules:
      active: true
      humidity_target: 85
      deadband_low: 75
      deadband_high: 90
    notes: Dark, still, humid. High CO2 produces antler form. Do NOT vent unless CO2 >15k.

  antler_development:
    label: Antler Development
    description: Fingers grow upward in high CO2. Can harvest as "antler reishi" or continue to conk.
    duration_estimate: 21-42
    transition_trigger: manual  # Operator decides antler vs conkform
    targets:
      temperature:
        ideal_min: 20
        ideal_max: 24
        accept_min: 18
        accept_max: 26
        alert_min: 15
        alert_max: 28
      humidity:
        ideal_min: 85
        ideal_max: 92
        accept_min: 80
        accept_max: 95
        alert_min: 75
        alert_max: 98
      co2:
        ideal_min: 2000
        ideal_max: 5000
        accept_min: 1000
        accept_max: 8000
        alert_min: 0
        alert_max: 10000
    fan_rules:
      authority: false
      burst_duration: 360
      humidity_floor: 80
      co2_trigger: 10000
      co2_critical: 15000
      mode: off
    humidifier_rules:
      active: true
      humidity_target: 88
      deadband_low: 80
      deadband_high: 92
    notes: Maintain high CO2 for coral/antler form. Some growers prefer this morphology.

  primordia:
    label: Conk Initiation
    description: "To form conks — drop CO2, introduce light, increase FAE."
    duration_estimate: 7-14
    transition_trigger: manual  # Operator triggers conk formation
    targets:
      temperature:
        ideal_min: 20
        ideal_max: 24
        accept_min: 18
        accept_max: 26
        alert_min: 15
        alert_max: 28
      humidity:
        ideal_min: 85
        ideal_max: 92
        accept_min: 80
        accept_max: 95
        alert_min: 75
        alert_max: 98
      co2:
        ideal_min: 500
        ideal_max: 1000
        accept_min: 0
        accept_max: 1500
        alert_min: 0
        alert_max: 2000
    fan_rules:
      authority: true
      burst_duration: 360
      humidity_floor: 80
      co2_trigger: 1500
      co2_critical: 2000
      mode: burst
    humidifier_rules:
      active: true
      humidity_target: 88
      deadband_low: 80
      deadband_high: 92
    notes: Dramatic CO2 drop required. This triggers shelf/conk formation.

  fruiting:
    label: Conk Development
    description: Shelf forms grow outward. Slow, steady growth.
    duration_estimate: 30-60
    transition_trigger: auto
    targets:
      temperature:
        ideal_min: 20
        ideal_max: 24
        accept_min: 18
        accept_max: 26
        alert_min: 15
        alert_max: 28
      humidity:
        ideal_min: 85
        ideal_max: 92
        accept_min: 80
        accept_max: 95
        alert_min: 75
        alert_max: 98
      co2:
        ideal_min: 400
        ideal_max: 800
        accept_min: 0
        accept_max: 1200
        alert_min: 0
        alert_max: 1500
    fan_rules:
      authority: true
      burst_duration: 360
      humidity_floor: 80
      co2_trigger: 1200
      co2_critical: 1500
      mode: burst
    humidifier_rules:
      active: true
      humidity_target: 88
      deadband_low: 80
      deadband_high: 92
    notes: Very long fruiting. Conks harden and develop varnished cap.

  late_stage_fruiting:
    label: Maturation / Spore Release
    description: Conk fully formed. Spore release begins.
    duration_estimate: 14-30
    transition_trigger: auto
    targets:
      temperature:
        ideal_min: 18
        ideal_max: 22
        accept_min: 16
        accept_max: 24
        alert_min: 14
        alert_max: 26
      humidity:
        ideal_min: 80
        ideal_max: 88
        accept_min: 75
        accept_max: 92
        alert_min: 70
        alert_max: 95
      co2:
        ideal_min: 400
        ideal_max: 800
        accept_min: 0
        accept_max: 1200
        alert_min: 0
        alert_max: 1500
    fan_rules:
      authority: true
      burst_duration: 0
      humidity_floor: 0
      co2_trigger: 0
      co2_critical: 0
      mode: continuous
    humidifier_rules:
      active: false
    notes: Continuous fan for spore management. Reishi spores are dense brown dust.

  rest:
    label: Drying / Storage
    description: Harvested conks dry for medicinal use.
    duration_estimate: 7-14
    transition_trigger: manual
    targets:
      temperature:
        ideal_min: 16
        ideal_max: 24
        accept_min: 14
        accept_max: 26
        alert_min: 10
        alert_max: 30
      humidity:
        ideal_min: 55
        ideal_max: 65
        accept_min: 45
        accept_max: 75
        alert_min: 35
        alert_max: 85
      co2:
        ideal_min: 400
        ideal_max: 800
        accept_min: 0
        accept_max: 1500
        alert_min: 0
        alert_max: 2000
    fan_rules:
      authority: false
      burst_duration: 0
      humidity_floor: 45
      co2_trigger: 2000
      co2_critical: 3000
      mode: monitor
    humidifier_rules:
      active: false
    notes: Low humidity for drying. Monitor until conks are fully dry.

sensor_authority:
  temperature: sht45
  humidity: sht45
  co2: scd41

safety:
  oversaturation_guard_rh: 95
  max_temp: 30
  min_temp: 14
  sensor_offline_minutes: 30
